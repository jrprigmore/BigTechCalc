[build]
  publish   = "site"
  functions = "site/netlify/functions"
  command   = ""

[functions]
  node_bundler = "esbuild"

# ---------------------------------------------------------------------
# Security headers. Google's page-experience signals do not read these
# directly, but a clean header set avoids browser console warnings and
# is a prerequisite for any future ad-fraud or brand-safety review.
# ---------------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options    = "nosniff"
    X-Frame-Options           = "SAMEORIGIN"
    Referrer-Policy           = "strict-origin-when-cross-origin"
    Permissions-Policy        = "geolocation=(), microphone=(), camera=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

# Static assets are content-addressed by deploy, safe to cache hard.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# JS and CSS change between deploys and are not fingerprinted, so
# revalidate rather than cache blind.
[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# ---------------------------------------------------------------------
# Canonical host. Pick ONE and redirect the other, or Google will split
# link equity between them.
# ---------------------------------------------------------------------
[[redirects]]
  from = "https://www.bigtechcalc.com/*"
  to   = "https://bigtechcalc.com/:splat"
  status = 301
  force = true

# ---------------------------------------------------------------------
# Netlify's "pretty URLs" post-processing serves every static page at
# BOTH its real .html path and a second, extensionless path — e.g.
# /terms.html and /terms are both live 200s, and /terms/ (trailing
# slash) redirects to the extensionless duplicate rather than the real
# canonical URL. Google was crawling all of it: the extensionless
# duplicates show up in Search Console as "Alternate page with proper
# canonical tag" (harmless, but it's crawl budget spent on a page that
# was only ever going to defer to the real one) and the trailing-slash
# form as "Page with redirect" pointing at that same duplicate instead
# of the canonical. force=true so these win over Netlify's own
# pretty-url resolution. Add two lines here for every new page shipped.
# ---------------------------------------------------------------------
[[redirects]]
  from = "/index.html"
  to   = "/"
  status = 301
  force = true

[[redirects]]
  from = "/rsu-refresher-calculator"
  to   = "/rsu-refresher-calculator.html"
  status = 301
  force = true

[[redirects]]
  from = "/rsu-refresher-calculator/"
  to   = "/rsu-refresher-calculator.html"
  status = 301
  force = true

[[redirects]]
  from = "/equity-vesting-schedule-explained"
  to   = "/equity-vesting-schedule-explained.html"
  status = 301
  force = true

[[redirects]]
  from = "/equity-vesting-schedule-explained/"
  to   = "/equity-vesting-schedule-explained.html"
  status = 301
  force = true

[[redirects]]
  from = "/privacy"
  to   = "/privacy.html"
  status = 301
  force = true

[[redirects]]
  from = "/privacy/"
  to   = "/privacy.html"
  status = 301
  force = true

[[redirects]]
  from = "/terms"
  to   = "/terms.html"
  status = 301
  force = true

[[redirects]]
  from = "/terms/"
  to   = "/terms.html"
  status = 301
  force = true

[[redirects]]
  from = "/nvidia-rsu-vesting-schedule"
